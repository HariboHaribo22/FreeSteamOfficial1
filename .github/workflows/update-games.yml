name: Update Free Steam Games

on:
  schedule:
    - cron: "0 0 * * *"   # каждый день
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate games.json
        run: |
          curl -s "https://api.steampowered.com/ISteamApps/GetAppList/v2/" > apps.json

          node -e "
          const fs = require('fs');

          const data = JSON.parse(fs.readFileSync('apps.json','utf8'));
          const apps = data.applist.apps;

          const games = apps
            .filter(a => a.name && a.name.length < 40)
            .slice(0, 200) 
            .map(a => ({
              name: a.name,
              appid: a.appid
            }));

          fs.writeFileSync('games.json', JSON.stringify(games, null, 2));
          "

      - name: Commit changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add games.json
          git commit -m "Update games list" || echo "No changes"
          git push

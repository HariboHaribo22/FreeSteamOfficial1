name: Steam Free Games Auto Update

on:
  schedule:
    - cron: "0 0 * * *"  # каждый день
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Steam apps list
        run: |
          curl -s https://api.steampowered.com/ISteamApps/GetAppList/v2/ > apps.json

      - name: Filter FREE games
        run: |
          node -e "
          const fs = require('fs');

          const apps = JSON.parse(fs.readFileSync('apps.json','utf8')).applist.apps;

          const sleep = ms => new Promise(r => setTimeout(r, ms));

          async function checkFree(appid){
            try {
              const res = await fetch('https://store.steampowered.com/api/appdetails?appids=' + appid);
              const data = await res.json();

              if(!data[appid]?.success) return null;

              const info = data[appid].data;

              if(info && info.is_free && info.type === 'game'){
                return {
                  name: info.name,
                  appid: appid
                };
              }
            } catch(e){}
            return null;
          }

          async function run(){
            const result = [];
            const sample = apps.slice(0, 3000); // ограничение чтобы GitHub не умер

            for(let i=0;i<sample.length;i++){
              const app = sample[i];

              if(!app.name) continue;

              const game = await checkFree(app.appid);

              if(game){
                console.log('FREE:', game.name);
                result.push(game);
              }

              if(i % 50 === 0){
                console.log('Checked:', i);
              }
            }

            fs.writeFileSync('games.json', JSON.stringify(result, null, 2));
          }

          run();
          "

      - name: Commit results
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add games.json
          git commit -m "Auto update free Steam games" || echo "No changes"
          git push
